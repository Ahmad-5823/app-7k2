<!DOCTYPE html>
<html lang="ar" dir="rtl" data-s="dark" data-acc="teal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#091014">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ثبات">
<meta name="description" content="ثبات — رفيقك للتعافي بخصوصية تامة">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>ثبات</title>
<style>
:root{--r:20px;--nav-h:64px;--ease:cubic-bezier(.2,.8,.2,1)}
html[data-s=dark]{color-scheme:dark;--bg:#091014;--bg2:#0d171b;--card:#121e23;--card2:#18272d;--card3:#1e3139;--line:rgba(255,255,255,.075);--tx:#eef5f4;--mut:#93a8ab;--faint:#5f767a;--ok:#3ddc97;--bad:#ff7070;--warn:#ffc857;--shadow:0 8px 30px rgba(0,0,0,.35);--glass:rgba(9,16,20,.82)}
html[data-s=light]{color-scheme:light;--bg:#f2f6f6;--bg2:#e9f0f0;--card:#fff;--card2:#eef4f4;--card3:#e0eaea;--line:rgba(10,35,40,.09);--tx:#0d2227;--mut:#566f74;--faint:#8ca2a6;--ok:#0f9d63;--bad:#d93f3f;--warn:#b7791f;--shadow:0 8px 28px rgba(20,50,55,.10);--glass:rgba(242,246,246,.85)}
html[data-s=dark][data-acc=teal]{--acc:#2dd4bf;--acc2:#0ea5a0;--onacc:#03201c}
html[data-s=dark][data-acc=gold]{--acc:#f5c451;--acc2:#d9981f;--onacc:#2a1d02}
html[data-s=dark][data-acc=sky]{--acc:#63b3ff;--acc2:#3b82f6;--onacc:#031530}
html[data-s=dark][data-acc=violet]{--acc:#b39dfb;--acc2:#8b5cf6;--onacc:#150a38}
html[data-s=light][data-acc=teal]{--acc:#0d9488;--acc2:#0f766e;--onacc:#fff}
html[data-s=light][data-acc=gold]{--acc:#b7791f;--acc2:#92600f;--onacc:#fff}
html[data-s=light][data-acc=sky]{--acc:#2563eb;--acc2:#1d4ed8;--onacc:#fff}
html[data-s=light][data-acc=violet]{--acc:#7c3aed;--acc2:#6d28d9;--onacc:#fff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:100%;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Arabic","Noto Naskh Arabic",Tahoma,sans-serif;line-height:1.65;font-size:16px;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
input,textarea,select{width:100%;background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;outline:none;transition:border-color .2s}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{min-height:92px;resize:vertical}
select{appearance:none}
h1,h2,h3,h4,p{margin:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
[hidden]{display:none!important}
/* shell */
#shell{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-bottom:calc(var(--nav-h) + 40px + env(safe-area-inset-bottom))}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
#top .ttl{flex:1;min-width:0}
#top .ttl b{display:block;font-size:19px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .ttl small{display:block;color:var(--mut);font-size:12.5px;margin-top:-2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);color:var(--tx);flex:none;transition:transform .15s}
.ib:active{transform:scale(.92)}
.ib svg,.nv svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#view{padding:6px 16px 0}
.pg{animation:up .38s var(--ease) both}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* nav */
#nav{position:fixed;inset-inline:0;bottom:0;z-index:30;max-width:560px;margin:0 auto;display:flex;align-items:stretch;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--faint);font-size:11.5px;font-weight:600;transition:color .2s}
.nv.on{color:var(--acc)}
.nv.on svg{stroke-width:2.3}
.sos{flex:none;width:76px;position:relative}
.sos button{position:absolute;top:-22px;left:50%;transform:translateX(-50%);width:62px;height:62px;border-radius:50%;background:linear-gradient(145deg,#ff8a7a,#e5484d);color:#fff;display:grid;place-items:center;box-shadow:0 8px 24px rgba(229,72,77,.45);border:4px solid var(--bg);transition:transform .15s}
.sos button:active{transform:translateX(-50%) scale(.92)}
.sos svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sos span{position:absolute;bottom:6px;width:100%;text-align:center;font-size:11.5px;font-weight:700;color:var(--bad)}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card.acc{background:linear-gradient(160deg,color-mix(in srgb,var(--acc) 16%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--acc) 35%,var(--line))}
.card.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--line))}
.sec{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 8px}
.sec h3{font-size:16px;font-weight:800}
.sec small,.mut{color:var(--mut)}
.sm{font-size:13.5px}
.xs{font-size:12px}
.mt{margin-top:10px}.mt2{margin-top:18px}
.center{text-align:center}
.row{display:flex;gap:10px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 16px;border-radius:16px;background:var(--card2);border:1px solid var(--line);font-weight:700;margin:8px 0;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--acc),var(--acc2));color:var(--onacc);border-color:transparent;box-shadow:0 6px 18px color-mix(in srgb,var(--acc) 30%,transparent)}
.btn.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:color-mix(in srgb,var(--bad) 45%,transparent);color:var(--bad)}
.btn.ok{background:color-mix(in srgb,var(--ok) 14%,var(--card));border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok)}
.btn.ghost{background:none}
.btn.sm{padding:8px 12px;font-size:14px;width:auto;margin:0;border-radius:12px}
.btn.big{padding:16px;font-size:17px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--acc);font-weight:700;font-size:14px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:99px;background:var(--card2);border:1px solid var(--line);font-size:12.5px;color:var(--mut)}
.chip.on{background:color-mix(in srgb,var(--acc) 18%,var(--card));border-color:var(--acc);color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button.chip{cursor:pointer;padding:7px 13px;font-size:14px}
.seg{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 6px;border-radius:12px;font-weight:700;font-size:14px;color:var(--mut);transition:all .2s;line-height:1.3}
.seg button small{display:block;font-size:11.5px;font-weight:500;opacity:.8}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:0 2px 10px rgba(0,0,0,.22)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;margin:0 -16px;padding-inline:16px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;padding:8px 15px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-weight:700;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--acc);color:var(--onacc);border-color:transparent}
.lbl{display:block;margin:14px 2px 6px;font-weight:700;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-height:118px;box-shadow:var(--shadow);transition:transform .15s}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:26px;line-height:1}
.tile b{font-size:16px}
.tile span{font-size:12.5px;color:var(--mut);line-height:1.45}
.tile.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.tile.sosT{background:linear-gradient(135deg,color-mix(in srgb,var(--bad) 22%,var(--card)),var(--card));border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:start}
.li:last-child{border-bottom:0}
.li .ic{font-size:20px;width:28px;text-align:center}
.li .sub{display:block;color:var(--mut);font-size:12.5px}
.li .arr{color:var(--faint);transform:scaleX(-1)}
/* ring */
.ringbox{position:relative;width:min(250px,68vw);aspect-ratio:1;margin:6px auto 4px}
.ringbox svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
.ringbox .bg{fill:none;stroke:var(--card3);stroke-width:9}
.ringbox .fg{fill:none;stroke:url(#rg);stroke-width:9;stroke-linecap:round;transition:stroke-dashoffset 1s var(--ease);filter:drop-shadow(0 0 8px color-mix(in srgb,var(--acc) 55%,transparent))}
.ringbox .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .big{font-size:clamp(54px,18vw,72px);font-weight:800;line-height:1;letter-spacing:-1px;font-variant-numeric:tabular-nums}
.ringbox .lab{color:var(--mut);font-size:15px;margin-top:4px}
.ringbox .sub2{color:var(--acc);font-size:13px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.units{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
.units div{background:var(--card2);border-radius:14px;padding:8px 2px;text-align:center}
.units b{display:block;font-size:19px;font-variant-numeric:tabular-nums;line-height:1.2}
.units small{font-size:11px;color:var(--mut)}
.bar{height:8px;border-radius:9px;background:var(--card3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc2),var(--acc));transition:width .8s var(--ease)}
/* tasks */
.task{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--faint);display:grid;place-items:center;flex:none;transition:all .2s;color:transparent;font-size:15px;font-weight:800}
.ck.ok{background:var(--ok);border-color:var(--ok);color:#04210f}
.ck.no{background:var(--bad);border-color:var(--bad);color:#fff}
.task .t{flex:1;min-width:0;font-weight:600;font-size:15px}
.task .t small{display:block;color:var(--mut);font-weight:400;font-size:12.5px}
.task.done .t{opacity:.55}
.mini{display:flex;gap:6px}
.mini button{width:34px;height:34px;border-radius:11px;background:var(--card2);border:1px solid var(--line);font-size:15px;font-weight:800}
.mini button.ok{background:var(--ok);color:#04210f;border-color:transparent}
.mini button.no{background:var(--bad);color:#fff;border-color:transparent}
.tipbox{font-size:18px;line-height:1.95;font-weight:600;padding:6px 2px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-size:11.5px;color:var(--mut);padding:4px 0}
.day{aspect-ratio:1;border-radius:13px;background:var(--card2);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:14px;position:relative;font-variant-numeric:tabular-nums;border:1.5px solid transparent}
.day.clean{background:color-mix(in srgb,var(--ok) 20%,var(--card));color:var(--ok)}
.day.slip{background:color-mix(in srgb,var(--bad) 22%,var(--card));color:var(--bad)}
.day.none,.day.future{opacity:.4;font-weight:500}
.day.today{border-color:var(--acc)}
.day.empty{background:none}
.day i{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:var(--acc)}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mut);justify-content:center;margin-top:12px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:4px;margin-inline-end:5px;vertical-align:middle}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat small{color:var(--mut);font-size:12px}
.hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:13.5px}
.hb span:first-child{width:92px;flex:none;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .bar{flex:1}
.hb b{width:28px;text-align:end}
.dots7{display:inline-flex;gap:4px;vertical-align:middle}
.dots7 i{width:9px;height:9px;border-radius:50%;background:var(--card3)}
.dots7 i.ok{background:var(--ok)}.dots7 i.broke{background:var(--bad)}
/* sheets */
#sheets .bd{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);animation:fade .25s both;display:flex;align-items:flex-end;justify-content:center}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh{width:100%;max-width:560px;max-height:92dvh;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-bottom:0;border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));animation:sl .32s var(--ease) both}
@keyframes sl{from{transform:translateY(100%)}to{transform:none}}
.sh .grip{width:42px;height:5px;border-radius:9px;background:var(--faint);opacity:.5;margin:2px auto 14px}
.sh h3{font-size:19px;margin-bottom:6px}
.sh .x{position:absolute}
.toast{position:fixed;z-index:90;bottom:calc(var(--nav-h) + 26px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);max-width:88vw;background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:14.5px;box-shadow:var(--shadow);animation:up .3s var(--ease) both}
/* lock */
#lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.lk-ic{font-size:44px}
.lk-dots{display:flex;gap:14px;margin:22px 0 8px;height:16px}
.lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--faint);transition:all .15s}
.lk-dots i.f{background:var(--acc);border-color:var(--acc);transform:scale(1.15)}
.lk-dots.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px;margin-top:22px;direction:ltr}
.pad button{height:76px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:26px;font-weight:700;transition:transform .1s,background .2s}
.pad button:active{transform:scale(.9);background:var(--card3)}
.pad .ghost{background:none;border:0;font-size:15px;color:var(--mut)}
/* emergency */
#emerg{position:fixed;inset:0;z-index:80;background:radial-gradient(120% 80% at 50% 0%,color-mix(in srgb,var(--acc) 14%,var(--bg)),var(--bg));overflow-y:auto;padding:calc(14px + env(safe-area-inset-top)) 18px 40px;animation:fade .3s both}
#emerg .in{max-width:520px;margin:0 auto}
.breath{width:190px;height:190px;margin:18px auto;border-radius:50%;display:grid;place-items:center;text-align:center;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 40%,transparent),color-mix(in srgb,var(--acc) 8%,transparent));border:2px solid color-mix(in srgb,var(--acc) 60%,transparent);transition:transform 4s ease-in-out}
.breath b{font-size:22px}
.timer{font-size:44px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:1px}
.step{display:flex;gap:12px;padding:10px 0;align-items:flex-start}
.step i{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--onacc);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:14px}
/* onboarding */
#ob{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;padding:calc(24px + env(safe-area-inset-top)) 22px 30px}
#ob .in{max-width:480px;margin:0 auto;min-height:calc(100dvh - 60px);display:flex;flex-direction:column}
.pdots{display:flex;gap:6px;justify-content:center;margin:6px 0 22px}
.pdots i{width:22px;height:5px;border-radius:9px;background:var(--card3)}
.pdots i.on{background:var(--acc)}
.hero-ic{font-size:64px;text-align:center;margin:16px 0 8px}
.big-t{font-size:26px;font-weight:800;text-align:center;line-height:1.4}
.swatch{display:flex;gap:12px}
.swatch button{width:38px;height:38px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatch button.on{border-color:var(--tx)}
.sw-teal{background:#2dd4bf}.sw-gold{background:#f5c451}.sw-sky{background:#63b3ff}.sw-violet{background:#b39dfb}
.sw{position:relative;display:inline-block;width:52px;height:30px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--card3);border-radius:99px;transition:.2s}
.sw span:before{content:"";position:absolute;width:24px;height:24px;border-radius:50%;background:#fff;top:3px;inset-inline-start:3px;transition:.2s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span:before{inset-inline-start:25px}
.ph{padding:30px 10px;text-align:center;color:var(--mut)}
.banner{background:color-mix(in srgb,var(--warn) 14%,var(--card));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);border-radius:16px;padding:12px 14px;margin:12px 0;font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
@media (max-width:360px){.units b{font-size:16px}.pad{grid-template-columns:repeat(3,68px)}.pad button{height:68px}}

</style>
</head>
<body>
<div id="shell" hidden><header id="top"></header><main id="view"></main></div>
<nav id="nav" hidden></nav>
<div id="sheets"></div>
<div id="lock" hidden></div>
<div id="ob" hidden></div>
<noscript><p style="padding:30px;text-align:center">يحتاج «ثبات» إلى تفعيل جافاسكربت.</p></noscript>
<script>

function diff(a,b){

  let y=b.getFullYear()-a.getFullYear(),m=b.getMonth()-a.getMonth(),d=b.getDate()-a.getDate(),hh=b.getHours()-a.getHours(),mm=b.getMinutes()-a.getMinutes(),ss=b.getSeconds()-a.getSeconds();
  if(ss<0){ss+=60;mm--}if(mm<0){mm+=60;hh--}if(hh<0){hh+=24;d--}
  if(d<0){d+=new Date(b.getFullYear(),b.getMonth(),0).getDate();m--}
  if(m<0){m+=12;y--}
  return{y:y,m:m,d:d,hh:hh,mm:mm,ss:ss};
}

function dayModal(ds){
  const d=pds(ds),fut=ds>today();
  const stl={clean:'نظيف ✅',slip:'زلة ❌',none:'غير محسوب',future:'قادم'};
  let h='<h3>'+d.getDate()+' '+AR_MONTHS[d.getMonth()]+' '+d.getFullYear()+'</h3>';
  K.forEach(k=>{
    const st=dayStatus(k,ds),ov=S.logs[k][ds];
    h+='<div class="card flat"><div class="row"><b class="grow">'+KN[k]+'</b><span class="chip '+(st==='clean'?'on':'')+'">'+stl[st]+'</span></div>'+
    (fut?'':'<div class="chips mt">'+[['clean','نظيف'],['slip','زلة'],['none','بلا حساب'],['auto','تلقائي']].map(o=>'<button class="chip '+((o[0]==='auto'&&!ov)||ov===o[0]?'on':'')+'" data-a="dayset" data-k="'+k+'" data-d="'+ds+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>')+'</div>';
  });
  const sl=S.slips.filter(s=>dstr(s.t)===ds);
  sl.forEach(s=>{h+='<div class="card flat"><b>زلة '+KN[s.counter]+'</b>'+(s.trigger?'<div class="sm">المحفّز: '+esc(s.trigger)+'</div>':'')+(s.lesson?'<div class="sm mut">الدرس: '+esc(s.lesson)+'</div>':'')+'</div>'});
  const ci=S.checkins[ds];
  if(ci)h+='<div class="card flat"><b>يومي</b> '+MOODS[ci.mood-1]+' <span class="mut sm">نوم '+(ci.sleep>=9?'9+':ci.sleep)+' س · رغبة '+ci.urge+'/5</span>'+(ci.note?'<div class="sm mt">'+esc(ci.note)+'</div>':'')+'</div>';
  const w=S.wins.filter(x=>dstr(x.t)===ds).length;if(w)h+='<div class="card flat">💪 انتصرت على '+w+' موجة هذا اليوم</div>';
  h+='<p class="mut xs">تعديل اليوم يدويًا لا يغيّر العدّاد الجاري، هو لتصحيح السجل فقط.</p><button class="btn" data-a="close">إغلاق</button>';
  sheet(h);
}
A.dayset=el=>{

  save();closeSheets();haptic(8);render();dayModal(ds);

function achView(el){
  const gk=S.ui.gk||'porn';
  const pend=S.pending.filter(p=>!p.done),earned=S.earned.filter(e=>!e.claimed);
  let h='';
  if(pend.length||earned.length){
    h+='<div class="sec"><h3>بانتظارك</h3></div>';
    earned.forEach(e=>{h+='<div class="card acc"><div class="row"><span style="font-size:26px">🎁</span><div class="grow"><b>'+esc(KN[e.counter])+' — '+goalName(e.days)+'</b><div class="sm">'+(e.reward?esc(e.reward):'جائزتك عند الله، وأكرِم نفسك بما تحب')+'</div></div><button class="btn sm ok" data-a="claim" data-id="'+e.id+'">استلمت</button></div></div>'});
    pend.forEach(p=>{h+='<div class="card bad"><div class="row"><span style="font-size:26px">⚖️</span><div class="grow"><b>'+esc(p.text)+'</b><div class="mut xs">'+(p.counter?esc(KN[p.counter])+' · ':'')+new Date(p.t).toLocaleDateString('ar')+'</div></div><button class="btn sm ok" data-a="pdone" data-id="'+p.id+'">نفّذتها</button></div></div>'});
  }
  const goals=C(gk).goals.slice().sort((a,b)=>a.days-b.days),e=elapsed(gk);
  h+='<div class="sec"><h3>أهدافي وجوائزي</h3></div><div class="seg">'+K.map(x=>'<button class="'+(x===gk?'on':'')+'" data-a="gk" data-k="'+x+'">'+KN[x]+'</button>').join('')+'</div><div class="list mt">'+
  goals.map(g=>{const ok=C(gk).start&&e>=g.days*DAY;return '<button class="li" data-a="goaledit" data-id="'+g.id+'"><span class="ic">'+(ok?'✅':'🎯')+'</span><span class="grow"><b>'+goalName(g.days)+'</b><span class="sub">'+(g.reward?'🎁 '+esc(g.reward):'اضغط لتحديد جائزة')+'</span></span></button>'}).join('')+'</div><button class="btn mt" data-a="goaladd">＋ هدف جديد</button>';
  h+='<div class="sec"><h3>عقوباتي البنّاءة</h3></div>'+listEditor('punish','عقوبات أضعها لنفسي عند الزلة','صدقة، ختمة، صلاة، صيام… شيء ينفعك ويقرّبك لله',['ختمة قرآن كاملة','صدقة جارية بمبلغ أحدّده','صيام يوم الاثنين','صلاة ركعتين قيام الليل أسبوعًا','تعليم أو مساعدة شخص اليوم']);
  const done=S.pending.filter(p=>p.done).length,cl=S.earned.filter(x=>x.claimed).length;
  h+='<p class="mut xs center mt2">عقوبات نُفّذت: '+done+' · جوائز استُلمت: '+cl+'</p>';
  el.innerHTML=h;
}

/* --- الإحصاءات --- */
function bars(map,max){
  const e=Object.keys(map).sort((a,b)=>map[b]-map[a]).slice(0,6);
  if(!e.length)return'<div class="ph">لا بيانات بعد</div>';
  const m=max||Math.max.apply(null,e.map(k=>map[k]));
  return e.map(k=>'<div class="hb"><span>'+esc(k)+'</span><div class="bar"><i style="width:'+Math.round(map[k]*100/m)+'%"></i></div><b>'+map[k]+'</b></div>').join('');
}
function statsView(el){
  let h='';
  K.forEach(k=>{
    const n=S.slips.filter(s=>s.counter===k).length;
    h+='<div class="sec"><h3>'+KN[k]+'</h3></div><div class="stat"><div><b>'+daysOf(k)+'</b><small>يوم حاليًا</small></div><div><b>'+Math.floor(bestMs(k)/DAY)+'</b><small>أفضل سلسلة</small></div><div><b>'+n+'</b><small>زلة</small></div></div>';
  });
  const tr={},hr={};
  const bucket=h=>h<4?'بعد منتصف الليل':h<6?'قبل الفجر':h<12?'صباحًا':h<16?'ظهرًا':h<19?'عصرًا':h<22?'مساءً':'ليلًا';
  S.slips.forEach(s=>{const t=s.trigger||'غير محدد';tr[t]=(tr[t]||0)+1;const b=bucket(new Date(s.t).getHours());hr[b]=(hr[b]||0)+1});
  h+='<div class="sec"><h3>ما الذي يوقعني؟</h3></div><div class="card"><b class="sm">أكثر المحفّزات</b><div class="mt">'+bars(tr)+'</div></div><div class="card"><b class="sm">أخطر الأوقات</b><div class="mt">'+bars(hr)+'</div></div>';
  const days=[];for(let i=13;i>=0;i--)days.push(dstr(Date.now()-i*DAY));
  const ci=days.map(d=>S.checkins[d]);
  if(ci.some(Boolean)){
    h+='<div class="sec"><h3>مزاجي ورغبتي (14 يومًا)</h3></div><div class="card"><div style="display:flex;gap:4px;align-items:flex-end;height:96px">'+ci.map((c,i)=>'<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;height:100%" title="'+days[i]+'">'+(c?'<div style="height:'+Math.max(4,c.urge*17)+'px;background:var(--bad);border-radius:5px;opacity:.85"></div><div style="height:'+Math.max(4,c.mood*11)+'px;background:var(--ok);border-radius:5px;opacity:.85"></div>':'<div style="height:4px;background:var(--card3);border-radius:5px"></div>')+'</div>').join('')+'</div><div class="legend"><span><i style="background:var(--ok)"></i>المزاج</span><span><i style="background:var(--bad)"></i>الرغبة</span></div></div>';
  }
  const act=S.rules.filter(r=>r.active);let ok=0,tot=0;
  act.forEach(r=>{for(let i=0;i<7;i++){const v=ruleVal(r,dstr(Date.now()-i*DAY));if(v){tot++;if(v==='ok')ok++}}});
  h+='<div class="sec"><h3>عامّة</h3></div><div class="stat"><div><b>'+(tot?Math.round(ok*100/tot)+'%':'—')+'</b><small>التزام القواعد</small></div><div><b>'+S.wins.length+'</b><small>موجة تجاوزتها</small></div><div><b>'+Object.keys(S.checkins).length+'</b><small>يوم سجّلته</small></div></div>';
  el.innerHTML=h;
}

function insights(){
  const tr={},hr={};
  const bucket=h=>h<4?'بعد منتصف الليل':h<6?'قبل الفجر':h<12?'صباحًا':h<16?'ظهرًا':h<19?'عصرًا':h<22?'مساءً':'ليلًا';
  S.slips.forEach(s=>{if(s.trigger)tr[s.trigger]=(tr[s.trigger]||0)+1;const b=bucket(new Date(s.t).getHours());hr[b]=(hr[b]||0)+1});
  const top=m=>Object.keys(m).sort((a,b)=>m[b]-m[a])[0];
  return{trig:top(tr),time:top(hr),n:S.slips.length};
}

  el.innerHTML=(ins.n?'<div class="card acc" style="margin-top:8px"><b>ما تعلّمته عن نفسي</b><div class="sm mt">'+(ins.trig?'أكثر محفّز يوقعني: <b>'+esc(ins.trig)+'</b><br>':'')+(ins.time?'أخطر وقت: <b>'+esc(ins.time)+'</b>':'')+'</div><div class="mut xs mt">من '+ins.n+' زلة سجّلتها. اعرف عدوّك لتهزمه.</div></div>':'<div class="card acc" style="margin-top:8px"><b>النفس الأمّارة تُهزم بمعرفتها</b><div class="mut sm mt">كل ما تكتبه هنا يقرّبك من فهم نفسك، وكل ما تسجّله يصير خريطة تحميك.</div></div>')+
  '<div class="grid2"><button class="tile" data-a="go" data-p="study"><span class="ic">🧭</span><b>دراسة نفسي</b><span>'+nAns+' من '+SELF_Q.length+' أسئلة أجبتها</span></button><button class="tile" data-a="go" data-p="diary"><span class="ic">📓</span><b>يومياتي</b><span>'+S.diary.length+' تدوينة</span></button><button class="tile" data-a="go" data-p="weekly"><span class="ic">🗓️</span><b>مراجعة الأسبوع</b><span>وقفة أسبوعية صادقة</span></button><button class="tile" data-a="go" data-p="settings"><span class="ic">⚙️</span><b>الإعدادات</b><span>المظهر، القفل، النسخ</span></button></div>';
},{title:'نفسي',tab:'me'});

/* ===== القفل ===== */
function cyrb(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return(4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function hashPin(pin,salt){let h=pin+'|'+salt;for(let i=0;i<4000;i++)h=cyrb(h+i+salt);return h}
let lkFail=0,lkUntil=0,hiddenAt=0;
function lockUI(o){
  const L=$('#lock');L.hidden=false;
  let buf='',first=null,len=o.mode==='enter'?S.pin.len:6;
  const title={enter:'أدخل الرقم السري',new:'اختر رقمًا سريًا (4–6 أرقام)',confirm:'أعد إدخال الرقم للتأكيد'};
  let mode=o.mode;
  function draw(msg){
    const ln=mode==='enter'?len:6;
    L.innerHTML='<div class="lk-ic">'+(mode==='enter'?'🌙':'🔐')+'</div><h2 style="margin-top:10px">'+(mode==='enter'?'ثبات':'الرقم السري')+'</h2><div class="mut sm center" id="lk-m">'+(msg||title[mode])+'</div><div class="lk-dots" id="lk-d">'+Array.from({length:ln},(_,i)=>'<i class="'+(i<buf.length?'f':'')+'"></i>').join('')+'</div>'+
    '<div class="pad">'+[1,2,3,4,5,6,7,8,9].map(n=>'<button data-lk="'+n+'">'+n+'</button>').join('')+'<button class="ghost" data-lk="x">'+(mode==='enter'?'نسيت؟':'إلغاء')+'</button><button data-lk="0">0</button><button class="ghost" data-lk="b" aria-label="حذف">⌫</button></div>'+(mode!=='enter'?'<button class="btn pri mt2" style="max-width:240px" data-lk="ok" '+(buf.length<4?'disabled':'')+'>تأكيد</button>':'');
  }
  function err(m){const d=$('#lk-d');if(d){d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake')}haptic([40,50,40]);buf='';setTimeout(()=>draw(m),420)}
  function submit(){
    if(mode==='enter'){
      if(Date.now()<lkUntil){err('انتظر '+Math.ceil((lkUntil-Date.now())/1000)+' ثانية');return}
      if(hashPin(buf,S.pin.salt)===S.pin.hash){lkFail=0;L.hidden=true;L.innerHTML='';o.onOk()}
      else{lkFail++;if(lkFail>=5){lkUntil=Date.now()+30000*Math.pow(2,Math.min(4,lkFail-5));err('محاولات كثيرة، انتظر قليلًا')}else err('رقم خاطئ')}
    }else if(mode==='new'){first=buf;buf='';mode='confirm';draw()}
    else{if(buf===first){const salt=uid();S.pin={salt:salt,hash:hashPin(buf,salt),len:buf.length};save();L.hidden=true;L.innerHTML='';o.onOk(true)}else{first=null;mode='new';err('الرقمان غير متطابقين')}}
  }
  L.onclick=e=>{
    const b=e.target.closest('[data-lk]');if(!b)return;const v=b.dataset.lk;haptic(8);
    if(v==='b'){buf=buf.slice(0,-1);draw()}
    else if(v==='x'){
      if(mode==='enter')forgotSheet();else{L.hidden=true;L.innerHTML='';if(o.onCancel)o.onCancel()}
    }
    else if(v==='ok'){if(buf.length>=4)submit()}
    else if(buf.length<(mode==='enter'?len:6)){buf+=v;draw();if(mode==='enter'&&buf.length===len)setTimeout(submit,120)}
  };
  draw();
}
function forgotSheet(){
  sheet('<h3>نسيت الرقم؟</h3><p class="mut">لحماية خصوصيتك لا توجد طريقة لاسترجاع الرقم. يمكنك مسح التطبيق والبدء من جديد، ثم استيراد نسخة احتياطية إن كانت عندك.</p><button class="btn bad" data-a="forgotwipe">مسح كل شيء والبدء من جديد</button><button class="btn" data-a="close">رجوع</button>',{});
  $('#sheets').style.position='relative';$('#sheets').style.zIndex=120;
}
A.forgotwipe=async()=>{if(await ask('سيُمسح كل شيء نهائيًا. متأكد؟',{danger:true,ok:'امسح',title:'تأكيد'})){try{localStorage.removeItem(KEY);localStorage.removeItem(KSNAP)}catch(e){}location.hash='';location.reload()}};
function lockNow(){
  if(!S.pin){toast('لم تضع رقمًا سريًا بعد، اضبطه من الإعدادات');return}
  locked=true;closeSheets();emClose();$('#shell').hidden=true;$('#nav').hidden=true;
  lockUI({mode:'enter',onOk:unlock});
}

A.lockNow=lockNow;
A.pinset=()=>{
  const run=()=>lockUI({mode:'new',onOk:()=>{toast('تم ضبط الرقم السري 🔐');render()},onCancel:()=>{}});
  if(S.pin){ // التحقق من القديم أولًا

  }else run();
};
A.pinoff=async()=>{if(await ask('إزالة الرقم السري؟ سيصبح تطبيقك مفتوحًا.',{danger:true,ok:'إزالة'})){S.pin=null;save();render();toast('أُزيل القفل')}};
document.addEventListener('visibilitychange',()=>{
  if(!S||!S.pin||!S.onboarded)return;
  if(document.hidden){hiddenAt=Date.now();if(S.lockAfter===0&&!locked)lockNow()}
  else if(!locked&&hiddenAt&&(Date.now()-hiddenAt)/1000>=S.lockAfter)lockNow();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#sheets .bd'))sheetClose();else if($('#emerg'))emClose()}});
/* ===== الترحيب ===== */
function onboard(){
  const ob=$('#ob');ob.hidden=false;$('#shell').hidden=true;$('#nav').hidden=true;
  const st={step:0,name:'',m:{porn:'later',mast:'later'},d:{porn:toLocalInput(Date.now()),mast:toLocalInput(Date.now())},pin:false};
  const dots=n=>'<div class="pdots">'+[0,1,2,3].map(i=>'<i class="'+(i<=n?'on':'')+'"></i>').join('')+'</div>';
  function draw(){
    let b='';const s=st.step;
    if(s===0)b=dots(0)+'<div class="hero-ic">🌙</div><div class="big-t">ثبات</div><p class="mut center mt">رفيقك لبناء قلب طاهر وحياة أنقى. خصوصيتك أولًا: كل بياناتك تبقى على جهازك ولا تُرسل لأحد.</p><div class="card flat mt2"><div class="step"><i>✓</i><div>عدّاد دقيق يعدّ كل ثانية</div></div><div class="step"><i>✓</i><div>خطة وقواعد وأدوات لحظة الرغبة</div></div><div class="step"><i>✓</i><div>فهم نفسك وتسجيل رحلتك بصدق</div></div></div><div style="flex:1"></div><button class="btn pri big" data-ob="next">لنبدأ</button>';
    else if(s===1)b=dots(1)+'<div class="hero-ic">🤍</div><div class="big-t">كيف أناديك؟</div><p class="mut center mt">اختياري، يظهر في التحية فقط.</p><input id="ob-n" class="mt2" value="'+esc(st.name)+'" placeholder="الاسم"><div style="flex:1"></div><button class="btn pri big" data-ob="next">التالي</button><button class="btn ghost" data-ob="back">رجوع</button>';
    else if(s===2){
      b=dots(2)+'<div class="big-t">متى تبدأ؟</div><p class="mut center mt">اختر لكل عدّاد، ويمكنك التعديل لاحقًا.</p>'+K.map(k=>'<div class="card"><b>'+KN[k]+'</b><div class="seg mt">'+[['now','الآن'],['date','تاريخ سابق'],['later','لاحقًا']].map(o=>'<button class="'+(st.m[k]===o[0]?'on':'')+'" data-ob="m" data-k="'+k+'" data-v="'+o[0]+'">'+o[1]+'</button>').join('')+'</div>'+(st.m[k]==='date'?'<input type="datetime-local" class="mt" data-obd="'+k+'" value="'+st.d[k]+'">':'')+'</div>').join('')+'<div style="flex:1"></div><button class="btn pri big" data-ob="next">التالي</button><button class="btn ghost" data-ob="back">رجوع</button>';
    }else b=dots(3)+'<div class="hero-ic">🔐</div><div class="big-t">رقم سري يحميك</div><p class="mut center mt">اختياري لكنه موصى به: لا يفتح التطبيق إلا من يعرف الرقم.</p>'+(st.pin?'<div class="card ok center mt2">✅ تم ضبط الرقم السري</div>':'<button class="btn big mt2" data-ob="pin">ضع رقمًا سريًا</button>')+'<div style="flex:1"></div><button class="btn pri big" data-ob="done">'+(st.pin?'ابدأ رحلتي':'ابدأ بدون رقم')+'</button><button class="btn ghost" data-ob="back">رجوع</button>';
    ob.innerHTML='<div class="in">'+b+'</div>';
  }
  ob.onclick=e=>{
    const t=e.target.closest('[data-ob]');if(!t)return;const a=t.dataset.ob;haptic(8);
    const n=$('#ob-n');if(n)st.name=n.value.trim();
    if(a==='next'){st.step++;draw()}
    else if(a==='back'){st.step--;draw()}
    else if(a==='m'){st.m[t.dataset.k]=t.dataset.v;draw()}
    else if(a==='pin'){ob.hidden=true;lockUI({mode:'new',onOk:()=>{st.pin=true;ob.hidden=false;draw()},onCancel:()=>{ob.hidden=false;draw()}})}
    else if(a==='done'){
      S.name=st.name;S.onboarded=true;
      K.forEach(k=>{if(st.m[k]==='now')C(k).start=Date.now();else if(st.m[k]==='date'){const ms=new Date(st.d[k]).getTime();if(!isNaN(ms)&&ms<=Date.now())C(k).start=ms;else C(k).start=Date.now()}C(k).reached=C(k).start?C(k).goals.filter(g=>Date.now()-C(k).start>=g.days*DAY).map(g=>g.id):[]});
      save();ob.hidden=true;ob.innerHTML='';$('#shell').hidden=false;$('#nav').hidden=false;location.hash='#/today';render();toast('بسم الله، بالتوفيق 🌙');
    }
  };
  ob.oninput=e=>{const t=e.target.closest('[data-obd]');if(t)st.d[t.dataset.obd]=t.value};
  draw();
}
/* ===== الإقلاع ===== */
let safeMode=false;
(function boot(){
  S=load();applyTheme();
  matchMedia('(prefers-color-scheme: light)').addEventListener&&matchMedia('(prefers-color-scheme: light)').addEventListener('change',()=>{if(S.theme==='auto')applyTheme()});
  let crashed=false;try{crashed=!!localStorage.getItem(KBOOT);localStorage.setItem(KBOOT,String(Date.now()))}catch(e){}
  if(crashed&&S.plugins.some(p=>p.enabled))safeMode=true;else loadPlugins();
  const _render=render;
  render=function(){_render();if(safeMode&&!locked){const v=$('#view');v.insertAdjacentHTML('afterbegin','<div class="banner">🛡️ التطبيق يعمل بالوضع الآمن لأن آخر تشغيل لم يكتمل. الإضافات متوقفة مؤقتًا. <button class="link" data-a="retryplugins">إعادة تشغيل الإضافات</button></div>')}};
  if(!S.onboarded){onboard()}
  else if(S.pin){locked=true;$('#shell').hidden=true;$('#nav').hidden=true;lockUI({mode:'enter',onOk:unlock})}
  else{$('#shell').hidden=false;$('#nav').hidden=false;render();setTimeout(checkGoals,500)}
  setInterval(()=>{if(S&&!locked&&S.onboarded){tick();checkGoals()}},1000);
  try{localStorage.removeItem(KBOOT)}catch(e){}
  if(S.onboarded){const a=snaps(),last=a[0];if(!last||Date.now()-last.t>DAY)snapshot('يومي تلقائي')}
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();

})();
