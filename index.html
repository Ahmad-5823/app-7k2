<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0b1a1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ثبات">
<title>ثبات</title>
<style>
:root{--bg:#0b1a1f;--bg2:#0f242b;--card:#143039;--card2:#1a3b46;--line:#24505e;--tx:#e8f1f2;--mut:#8fb0b8;--acc:#e6b85c;--acc2:#4fd1a5;--bad:#ef6b6b;--ok:#4fd1a5;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;font-size:16px;line-height:1.65}
body{overscroll-behavior-y:none}
body.noscroll{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
a{color:var(--acc);cursor:pointer;text-decoration:underline}
input,textarea,select{font:inherit;color:var(--tx);background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;outline:none;margin:4px 0}
input[type=checkbox],input[type=radio]{width:auto;margin:0 0 0 6px}
input[type=range]{padding:0}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
textarea{resize:vertical;min-height:80px}
textarea.code{font-family:Consolas,monospace;font-size:13px;min-height:200px;direction:ltr;text-align:left}
h2{margin:6px 0 10px;font-size:22px}
h3{margin:0 0 8px;font-size:17px}
.mut{color:var(--mut)}.sm{font-size:13px}.center{text-align:center}.mt{margin-top:10px}
#top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 16px 8px;background:linear-gradient(var(--bg) 70%,transparent);max-width:560px;margin:0 auto}
.brand{font-size:20px;font-weight:700;color:var(--acc)}
.ib{font-size:20px;padding:6px 10px;border-radius:12px;background:var(--card)}
#app{max-width:560px;margin:0 auto;padding:0 14px calc(100px + env(safe-area-inset-bottom))}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:10px 0}
.card.bad{border-color:var(--bad)}
.card.warn{border-color:var(--acc)}
.btn{display:block;width:100%;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--line);text-align:center;font-weight:600;margin:6px 0}
.btn.gold{background:var(--acc);color:#1b1405;border-color:var(--acc)}
.btn.bad{background:rgba(239,107,107,.15);border-color:var(--bad);color:#ffb3b3}
.btn.ok{background:rgba(79,209,165,.15);border-color:var(--ok);color:#a7f0d6}
.btn.sm{padding:6px 10px;font-size:14px;width:auto;display:inline-block}
.btn.big{font-size:19px;padding:16px}
.link{display:block;margin:6px auto;color:var(--mut);text-decoration:underline;font-size:14px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg2);padding:4px;border-radius:16px;margin:8px 0}
.seg.s3{grid-template-columns:1fr 1fr 1fr}
.seg button{padding:8px 4px;border-radius:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;line-height:1.3}
.seg button small{color:var(--mut);font-weight:400;font-size:12px}
.seg button.on{background:var(--card2);color:var(--acc);box-shadow:0 0 0 1px var(--line)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0;margin:6px 0}
.tabs button{flex:0 0 auto;padding:7px 14px;border-radius:20px;background:var(--bg2);border:1px solid var(--line);font-size:14px}
.tabs button.on{background:var(--acc);color:#1b1405;border-color:var(--acc);font-weight:700}
.chip{display:inline-block;margin:3px;padding:5px 10px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);font-size:13px}
.ringcard{text-align:center}
.ringwrap{position:relative;width:250px;max-width:80vw;margin:6px auto}
.ringwrap svg{width:100%;display:block}
.rtrack{fill:none;stroke:var(--bg2);stroke-width:12}
.rtrack2{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:2 5}
.rprog{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.rdot{fill:var(--acc);transform-origin:120px 120px;transition:transform .9s linear}
.rcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.rdays{font-size:58px;font-weight:800;line-height:1;color:var(--tx)}
.rlbl{color:var(--mut);margin-top:2px}
.rpct{font-size:12px;color:var(--acc);margin-top:6px;max-width:130px}
.cells{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:10px}
.cell{background:var(--bg2);border-radius:12px;padding:6px 2px;display:flex;flex-direction:column;align-items:center}
.cell b{font-size:18px;font-variant-numeric:tabular-nums}
.cell span{font-size:11px;color:var(--mut)}
.goalline{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.st{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.st b{display:block;font-size:17px;color:var(--acc)}
.st span{font-size:11px;color:var(--mut)}
.lst{list-style:none;margin:0;padding:0}
.lst li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.lst li:last-child{border-bottom:0}
.lst li button{color:var(--bad);padding:2px 8px}
.addrow{display:flex;gap:6px;align-items:center;margin-top:8px}
.addrow input{margin:0}
.addrow .btn{margin:0;white-space:nowrap}
.sugg summary{cursor:pointer;color:var(--acc);margin-top:8px;font-size:14px}
.lbl{display:block;margin:10px 0 2px;font-size:14px;color:var(--mut)}
.chk label{display:inline-flex;align-items:center;margin:4px 8px 4px 0}
#nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:center;gap:0;background:var(--bg2);border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom))}
#nav button{flex:1;max-width:110px;display:flex;flex-direction:column;align-items:center;padding:4px 0;color:var(--mut);font-size:11px;border-radius:12px}
#nav button i{font-style:normal;font-size:21px}
#nav button.on{color:var(--acc)}
#fab{position:fixed;left:12px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:31;background:var(--bad);color:#fff;font-weight:700;border-radius:26px;padding:11px 16px;box-shadow:0 4px 16px rgba(0,0,0,.45)}
.lock{position:fixed;inset:0;z-index:1000;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.lock.show{display:flex}
.lk-box{width:100%;max-width:340px;text-align:center}
.lk-logo{font-size:44px}
#lk-dots{display:flex;justify-content:center;gap:12px;margin:14px 0;min-height:18px}
#lk-dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
#lk-dots i.f{background:var(--acc)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.keypad button{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 0;font-size:22px;font-weight:600}
#lk-msg{color:var(--bad);min-height:24px}
.mback{position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.modal{position:relative;background:var(--card);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:560px;max-height:90vh;overflow:auto}
.modal .mx,#emerg .mx{position:absolute;top:10px;left:12px;font-size:18px;padding:4px 10px;color:var(--mut)}
.mq{font-size:17px;margin:6px 0 14px}
#toast{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--card2);border:1px solid var(--acc);padding:10px 16px;border-radius:14px;z-index:1500;opacity:0;pointer-events:none;transition:.3s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .h{text-align:center;color:var(--mut);font-size:12px}
.day{aspect-ratio:1;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--bg2);position:relative}
.day.fut{opacity:.35}
.day.today{box-shadow:0 0 0 2px var(--acc)}
.day.empty{border:0;background:none}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:4px}
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:13px}
.tag.clean{background:rgba(79,209,165,.25)}.tag.slip{background:rgba(239,107,107,.3)}.tag.none{background:var(--bg2)}
.tipbox{min-height:170px;display:flex;flex-direction:column;justify-content:center;font-size:20px;line-height:1.9;text-align:center}
.tipbox .cat{font-size:12px;color:var(--acc);margin-bottom:8px}
.fade{animation:fd .5s}
@keyframes fd{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 10px;text-align:center}
.mi i{font-style:normal;font-size:30px;display:block}
.mi b{display:block;margin-top:2px}
.mi span{font-size:12px;color:var(--mut)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.bar .bl{width:120px;flex:0 0 120px}
.bar .bt{flex:1;background:var(--bg2);border-radius:8px;height:14px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:linear-gradient(90deg,var(--acc2),var(--acc))}
.item{border-bottom:1px solid var(--line);padding:10px 0}
.item:last-child{border-bottom:0}
.dots7{display:inline-flex;gap:3px;margin-right:6px}
.dots7 i{width:9px;height:9px;border-radius:2px;background:var(--bg2);display:block}
.dots7 i.ok{background:var(--ok)}.dots7 i.broke{background:var(--bad)}
#emerg{position:fixed;inset:0;z-index:1100;background:var(--bg);overflow:auto}
.em-in{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px 40px;position:relative}
.emring{position:relative;width:200px;margin:10px auto}
.emring svg{width:100%;display:block}
.emc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.emc b{font-size:36px;font-variant-numeric:tabular-nums}
.pulse{width:70px;height:70px;border-radius:50%;background:radial-gradient(var(--acc2),transparent 70%);margin:0 auto;animation:pl 10s infinite ease-in-out}
@keyframes pl{0%{transform:scale(.6)}40%{transform:scale(1.3)}100%{transform:scale(.6)}}
.big-reason{font-size:19px;text-align:center;padding:14px;border:1px dashed var(--acc);border-radius:16px;margin:10px 0}
.warnbox{background:rgba(230,184,92,.12);border:1px solid var(--acc);border-radius:14px;padding:10px;font-size:14px}

</style>
</head>
<body>
<div id="lock" class="lock"></div>
<div id="shell" hidden>
  <header id="top"><div class="brand">🌙 ثبات</div><button class="ib" data-act="lockNow" aria-label="قفل">🔒</button></header>
  <main id="app"><div id="view"></div></main>
  <button id="fab" data-act="emerg">🆘 طوارئ</button>
  <nav id="nav"></nav>
</div>
<script>
(function(){
'use strict';
const TIPS={"deen": {"n": "دينية وإيمانية", "t": ["غضّ البصر أول الطريق، قال تعالى: ﴿قُل لِّلْمُؤْمِنِينَ يَغُضُّوا مِنْ أَبْصَارِهِمْ وَيَحْفَظُوا فُرُوجَهُمْ ذَٰلِكَ أَزْكَىٰ لَهُمْ﴾.", "﴿وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ﴾ — كلما خفت الله في خلوتك ارتفعت منزلتك عنده.", "﴿وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا﴾ — لكل ضيق مخرج، فاثبت حتى يأتيك.", "﴿أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ﴾ — إذا ضاق صدرك فاذكر الله بدل أن تهرب إلى الشاشة.", "﴿وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا﴾ — مجاهدتك لنفسك وعدٌ من الله لك بالهداية.", "﴿قُلْ يَا عِبَادِيَ الَّذِينَ أَسْرَفُوا عَلَىٰ أَنفُسِهِمْ لَا تَقْنَطُوا مِن رَّحْمَةِ اللَّهِ﴾ — لا يأس مهما تكررت العثرة.", "﴿إِنَّ الْحَسَنَاتِ يُذْهِبْنَ السَّيِّئَاتِ﴾ — أتبع كل زلة بحسنة سريعة: ركعتان أو صدقة.", "﴿وَاللَّهُ يُرِيدُ أَن يَتُوبَ عَلَيْكُمْ﴾ — الله يريد لك التوبة أكثر مما تريدها لنفسك.", "﴿فَإِنَّ مَعَ الْعُسْرِ يُسْرًا﴾ — صعوبة الأسابيع الأولى مؤقتة، واليسر قادم.", "﴿وَأَمَّا مَنْ خَافَ مَقَامَ رَبِّهِ وَنَهَى النَّفْسَ عَنِ الْهَوَىٰ فَإِنَّ الْجَنَّةَ هِيَ الْمَأْوَىٰ﴾ — نهي النفس عن الهوى طريق الجنة.", "﴿إِنَّ النَّفْسَ لَأَمَّارَةٌ بِالسُّوءِ إِلَّا مَا رَحِمَ رَبِّي﴾ — النفس تأمر بالسوء، فاطلب رحمة الله وأعِنه عليها بالحذر.", "﴿قَدْ أَفْلَحَ مَن زَكَّاهَا﴾ — الفلاح في تزكية النفس لا في إطلاقها.", "﴿يَعْلَمُ خَائِنَةَ الْأَعْيُنِ وَمَا تُخْفِي الصُّدُورُ﴾ — الله يعلم نظرة العين وما يخفيه القلب.", "﴿أَلَمْ يَعْلَم بِأَنَّ اللَّهَ يَرَىٰ﴾ — استحضر رؤية الله لك في كل خلوة.", "﴿وَاسْتَعِينُوا بِالصَّبْرِ وَالصَّلَاةِ﴾ — الصبر والصلاة سلاحك الأول عند الشدة.", "﴿إِنَّ الصَّلَاةَ تَنْهَىٰ عَنِ الْفَحْشَاءِ وَالْمُنكَرِ﴾ — حافظ على صلاتك فهي حصنك.", "﴿وَاصْبِرْ نَفْسَكَ مَعَ الَّذِينَ يَدْعُونَ رَبَّهُم بِالْغَدَاةِ وَالْعَشِيِّ﴾ — اختر صحبة تعينك على الطاعة.", "﴿وَمَن يَعْتَصِم بِاللَّهِ فَقَدْ هُدِيَ إِلَىٰ صِرَاطٍ مُّسْتَقِيمٍ﴾ — الاعتصام بالله هو الطريق.", "﴿وَإِنِّي لَغَفَّارٌ لِّمَن تَابَ وَآمَنَ وَعَمِلَ صَالِحًا ثُمَّ اهْتَدَىٰ﴾ — التوبة مع العمل الصالح مغفرة مضمونة بوعد الله.", "﴿وَهُوَ مَعَكُمْ أَيْنَ مَا كُنتُمْ﴾ — الله معك في غرفتك وعلى هاتفك وفي كل مكان.", "﴿وَلَا تَيْأَسُوا مِن رَّوْحِ اللَّهِ﴾ — اليأس ليس من أخلاق المؤمنين.", "﴿إِنَّ اللَّهَ يُحِبُّ التَّوَّابِينَ وَيُحِبُّ الْمُتَطَهِّرِينَ﴾ — الله يحب من يعود إليه، فعد كلما تعثرت.", "﴿وَمَن يَعْمَلْ سُوءًا أَوْ يَظْلِمْ نَفْسَهُ ثُمَّ يَسْتَغْفِرِ اللَّهَ يَجِدِ اللَّهَ غَفُورًا رَّحِيمًا﴾ — الاستغفار بعد الذنب باب مفتوح دائمًا.", "﴿وَلَمْ يُصِرُّوا عَلَىٰ مَا فَعَلُوا﴾ — المؤمن يعثر لكنه لا يصرّ؛ فقم فورًا.", "﴿وَلَا تَقْرَبُوا الزِّنَىٰ﴾ — النهي عن القرب يشمل المقدمات من نظر وتصفح وخلوة؛ ابتعد عن الطرق المؤدية.", "قال ﷺ عن السبعة الذين يظلهم الله في ظله: «وشابٌّ نشأ في عبادة الله» (متفق عليه) — شبابك في الطاعة مرتبة عظيمة.", "قال ﷺ: «يا معشر الشباب من استطاع منكم الباءة فليتزوج، ومن لم يستطع فعليه بالصوم فإنه له وجاء» (متفق عليه) — الصوم علاج نبوي لشدة الشهوة.", "قال ﷺ: «لا تتبع النظرة النظرة، فإن لك الأولى وليست لك الآخرة» (أبو داود والترمذي) — أول نظرة تُعفى، والثانية مسؤوليتك.", "قال ﷺ: «اتق الله حيثما كنت، وأتبع السيئة الحسنة تمحها» (الترمذي) — تقوى الله في كل مكان، وحسنة بعد كل خطأ.", "قال ﷺ: «كل ابن آدم خطّاء، وخير الخطائين التوابون» (الترمذي وابن ماجه) — الخطأ بشري، والعودة هي الفضل.", "قال ﷺ: «التائب من الذنب كمن لا ذنب له» (ابن ماجه) — ابدأ صفحتك بعد التوبة وكأنها بيضاء.", "قال ﷺ: «احفظ الله يحفظك» (الترمذي) — من حفظ الله في خلوته حفظه الله في أمره كله.", "قال ﷺ: «المؤمن القوي خير وأحب إلى الله من المؤمن الضعيف... احرص على ما ينفعك واستعن بالله ولا تعجز» (مسلم).", "قال ﷺ: «من ترك شيئًا لله عوّضه الله خيرًا منه» (أحمد) — ما تتركه لله لا يضيع.", "قال ﷺ: «ما من عبد يذنب ذنبًا فيحسن الطهور، ثم يقوم فيصلي ركعتين، ثم يستغفر الله إلا غفر له» (أبو داود والترمذي).", "قال ﷺ: «إنما الأعمال بالنيات» (متفق عليه) — جدّد نيتك كل صباح: أترك لله.", "قال ﷺ: «الحياء لا يأتي إلا بخير» (متفق عليه) — حافظ على حيائك من الله ومن نفسك.", "قال ﷺ: «ألا وإن في الجسد مضغة إذا صلحت صلح الجسد كله» (متفق عليه) — إصلاح القلب هو أصل المعركة.", "قال ﷺ: «ومن يستعفف يعفّه الله، ومن يتصبّر يصبّره الله» (متفق function merge(d,o){
  if(Array.isArray(d)||typeof d!=='object'||d===null)return o===undefined?d:o;
  if(o===null||typeof o!=='object'||Array.isArray(o))return d;
  const r={};
  for(const k in d)r[k]=(k in o)?merge(d[k],o[k]):d[k];
  for(const k in o)if(!(k in r))r[k]=o[k];
  return r;
}

function override(name,fn,pid){

const C=k=>S.counters[k];

function bestMs(k){let b=elapsed(k);C(k).streaks.forEach(s=>{b=Math.max(b,s.end-s.start)});return b}
function totalMs(k){let t=elapsed(k);C(k).streaks.forEach(s=>{t+=Math.max(0,s.end-s.start)});return t}
function slipDays(k){return Object.keys(S.logs[k]).filter(d=>S.logs[k][d]==='slip').length}
function fmtDur(ms){const d=Math.floor(ms/864e5);if(d>=1)return d+' يوم';return Math.floor(ms/36e5)+' ساعة'}
function nextGoal(k){const el=elapsed(k);return C(k).goals.slice().sort((a,b)=>a.days-b.days).find(g=>el<g.days*864e5)||null}
function setStart(k,ms){
  const c=C(k);c.start=ms;

function doSlip(k,info){
  const c=C(k),now=Date.now();
  if(c.start)c.streaks.push({start:c.start,end:now});
  S.logs[k][dstr(now)]='slip';
  S.slips.push({id:uid(),t:now,counter:k,streakMs:c.start?now-c.start:0,before:info.before||'',trigger:info.trigger||'',lesson:info.lesson||'',rule:info.rule||'',newRule:info.newRule||'',punish:info.punish||''});
  c.start=now;c.reachedIds=[];

}
function checkGoals(){
  if(!S)return;
  const got=[];
  CK.forEach(k=>{
    const c=C(k);if(!c.start)return;const el=elapsed(k);
    c.goals.forEach(g=>{
      if(el>=g.days*864e5&&c.reachedIds.indexOf(g.id)<0){
        c.reachedIds.push(g.id);
        S.earned.push({id:uid(),counter:k,days:g.days,reward:g.reward||'',t:Date.now(),claimed:false});
        got.push({k:k,g:g});emit('goal',{counter:k,goal:g});

      modal('<h3>🎉 ما شاء الله، حققت هدفًا!</h3>'+got.map(x=>'<div class="card"><b>'+esc(CN[x.k])+' — '+goalName(x.g.days)+'</b><div class="mut">'+(x.g.reward?'🎁 جائزتك: '+esc(x.g.reward):'لم تحدّد جائزة لهذا الهدف، لكن الجائزة الكبرى عند الله.')+'</div></div>').join('')+'<button class="btn gold" data-act="close">الحمد لله</button>');

function hashPin(pin,salt){
  let h1=0xdeadbeef,h2=0x41c6ce57;
  for(let r=0;r<2500;r++){const s=salt+pin+r;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return(4294967296*(2097151&h2)+(h1>>>0)).toString(36);
}
const lk={mode:'enter',buf:'',first:'',fails:0,until:0,msg:''};

}
function showLock(mode){lk.mode=mode;lk.buf='';lk.first='';lk.msg='';locked=true;$('#lock').classList.add('show');drawLock()}
function drawLock(){
  const T={enter:['أدخل الرقم السري','تطبيقك خاص بك'],verify:['أدخل الرقم الحالي','للتأكد قبل التغيير'],setup1:['أنشئ رقمًا سريًا','من 4 إلى 8 أرقام'],setup2:['أعد إدخال الرقم للتأكيد','']}[lk.mode];
  $('#lk-title').textContent=T[0];$('#lk-sub').textContent=T[1];
  const n=Math.max(4,lk.buf.length);let d='';for(let i=0;i<n;i++)d+='<i class="'+(i<lk.buf.length?'f':'')+'"></i>';
  $('#lk-dots').innerHTML=d;$('#lk-msg').textContent=lk.msg;

  if(lk.mode==='setup1'&&!S.pin)l='<a data-act="lkskip">تخطّي القفل الآن</a>';

function lkSubmit(){
  const b=lk.buf;
  if(b.length<4){lk.msg='الرقم قصير (4 أرقام على الأقل)';drawLock();return}
  if(lk.mode==='enter'||lk.mode==='verify'){
    if(Date.now()<lk.until){lk.msg='انتظر قليلًا ثم أعد المحاولة';lk.buf='';drawLock();return}
    if(S.pin&&hashPin(b,S.pin.salt)===S.pin.hash){
      lk.fails=0;
      if(lk.mode==='verify'){showLock('setup1');return}
      unlock();return;
    }
    lk.fails++;lk.buf='';lk.msg='رقم غير صحيح';
    if(lk.fails>=5){lk.until=Date.now()+30000;lk.fails=0;lk.msg='محاولات كثيرة، انتظر 30 ثانية'}
    drawLock();return;
  }
  if(lk.mode==='setup1'){lk.first=b;lk.buf='';lk.mode='setup2';lk.msg='';drawLock();return}
  if(lk.mode==='setup2'){
    if(b!==lk.first){lk.mode='setup1';lk.buf='';lk.first='';lk.msg='الرقمان غير متطابقين، أعد المحاولة';drawLock();return}
    const salt=uid();S.pin={salt:salt,hash:hashPin(b,salt)};S.settings.noPin=false;save();
    if(locked&&!started){unlock()}else{$('#lock').classList.remove('show');locked=false;toast('تم حفظ الرقم السري ✓')}
  }
}

const CIRC=2*Math.PI*104;
COMP.ringCard=function(k){
  const c=C(k);
  if(!c.start)return '<div class="card center"><h3>'+CN[k]+'</h3><p class="mut">حدّد تاريخ ووقت بدايتك لينطلق العدّاد</p><input type="datetime-local" id="st-'+k+'" value="'+toLocalInput(Date.now())+'" data-now="'+toLocalInput(Date.now())+'"><button class="btn gold mt" data-act="setstart" data-k="'+k+'">ابدأ العدّ</button><p class="mut sm">إن كنت نظيفًا منذ مدة فاختر تاريخًا سابقًا.</p></div>';
  const cells=[['y','سنة'],['m','شهر'],['d','يوم'],['hh','ساعة'],['mm','دقيقة'],['ss','ثانية']];
  return '<div class="card ringcard" data-k="'+k+'"><div class="ringwrap"><svg viewBox="0 0 240 240" aria-hidden="true"><defs><linearGradient id="gr-'+k+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--acc2)"/><stop offset="1" stop-color="var(--acc)"/></linearGradient></defs><circle class="rtrack" cx="120" cy="120" r="104"/><circle class="rprog" cx="120" cy="120" r="104" stroke="url(#gr-'+k+')" stroke-dasharray="'+CIRC.toFixed(1)+'" stroke-dashoffset="'+CIRC.toFixed(1)+'" transform="rotate(-90 120 120)"/><circle class="rtrack2" cx="120" cy="120" r="90"/><circle class="rdot" cx="120" cy="30" r="5"/></svg><div class="rcenter"><div class="rdays">0</div><div class="rlbl">يوم نظيف</div><div class="rpct"></div></div></div><div class="cells">'+cells.map(x=>'<div class="cell"><b data-u="'+x[0]+'">0</b><span>'+x[1]+'</span></div>').join('')+'</div><div class="goalline"></div></div>';
};
function updRing(card){
  const k=card.dataset.k,c=C(k);if(!c||!c.start)return;
  const now=Date.now(),ms=Math.max(0,now-c.start),p=diffParts(c.start,now),days=Math.floor(ms/864e5),g=nextGoal(k);
  const pct=g?Math.min(1,ms/(g.days*864e5)):1;
  $('.rprog',card).setAttribute('stroke-dashoffset',(CIRC*(1-pct)).toFixed(1));
  $('.rdot',card).style.transform='rotate('+(Math.floor(ms/1000)*6)+'deg)';
  $('.rdays',card).textContent=days;
  $('.rpct',card).textContent=g?Math.floor(pct*100)+'% نحو '+goalName(g.days):'تحققت كل الأهداف 🎉';
  $$('[data-u]',card).forEach(b=>{b.textContent=p[b.dataset.u]});
  const gl=$('.goalline',card),key=g?g.id+'|'+(g.reward||''):'none';
  if(gl.dataset.key!==key){
    gl.dataset.key=key;
    gl.innerHTML=g?'<div>🎯 الهدف القادم: <b>'+goalName(g.days)+'</b></div><div class="mut sm">'+(g.reward?'🎁 جائزتك: '+esc(g.reward):'لم تحدّد جائزة لهذا الهدف')+' <a data-act="go" data-p="rewards" data-rc="'+k+'">تعديل</a></div>':'<div>ما شاء الله! أضف هدفًا جديدًا من «جوائز وعقوبات»</div>';
  }
}

function dayStatus(k,ds){
  const L=S.logs[k][ds];if(L)return L;
  const day=pds(ds),td=sod(Date.now());
  if(day>td)return'future';
  const c=C(k);
  if(c.start&&sod(c.start)<=day)return'clean';
  for(let i=0;i<c.streaks.length;i++){const s=c.streaks[i];if(sod(s.start)<=day&&day<=sod(s.end))return'clean'}
  return'none';
}

function tipIds(cat){
  const ks=cat==='all'?Object.keys(TIPS):[cat],o=[];
  ks.forEach(k=>{if(TIPS[k])TIPS[k].t.forEach((_,i)=>o.push(k+':'+i))});
  return o;
}
function tipById(id){
  const p=String(id).split(':'),c=TIPS[p[0]];
  return c&&c.t[+p[1]]!==undefined?{id:id,cat:p[0],catName:c.n,text:c.t[+p[1]]}:null;
}
function nextTipId(cat){
  let a=(S.tips.deck[cat]||[]).filter(id=>tipById(id));
  if(!a.length)a=shuffle(tipIds(cat));
  const id=a.pop();S.tips.deck[cat]=a;return id;
}
let curTip=null,tipFresh=false;
COMP.tipCard=function(t){
  if(!t)return '<div class="mut">💡<br>'+tipIds('all').length+' نصيحة مخفية بانتظارك<br>اضغط الزر لتظهر لك واحدة</div>';
  return '<div class="cat">'+esc(t.catName)+'</div><div>'+esc(t.text)+'</div>';
};
reg('tips',el=>{
  const cat=S.ui.tipCat,ids=tipIds(cat),set={};ids.forEach(i=>{set[i]=1});
  const seen=S.tips.seen.filter(i=>set[i]).length;
  const cats=['all'].concat(Object.keys(TIPS));
  el.innerHTML='<h2>النصائح</h2><div class="tabs">'+cats.map(c=>'<button class="'+(c===cat?'on':'')+'" data-act="tipcat" data-c="'+esc(c)+'">'+(c==='all'?'الكل':esc(TIPS[c].n))+'</button>').join('')+'</div>'+
  '<div class="card tipbox'+(tipFresh?' fade':'')+'">'+comp('tipCard',curTip)+'</div>'+
  '<button class="btn gold big" data-act="newtip">'+(curTip?'نصيحة أخرى':'أظهر لي نصيحة')+'</button>'+
  (curTip?'<button class="btn" data-act="tipfav" data-id="'+esc(curTip.id)+'">'+(S.tips.fav.indexOf(curTip.id)>=0?'★ في المفضلة (إزالة)':'☆ أضفها للمفضلة')+'</button>':'')+
  '<button class="btn" data-act="favs">⭐ المفضلة ('+S.tips.fav.length+')</button>'+
  '<p class="center mut sm">قرأت '+seen+' من '+ids.length+' نصيحة في هذا التصنيف</p>';
  tipFresh=false;
});

  const avgD=avg.length?Math.round(avg.reduce((a,s)=>a+s.streakMs,0)/avg.length/864e5*10)/10:0;
  out+='<div class="card"><h3>⏰ متى تقع الزلات؟</h3>'+bars(bc)+'</div>';
  if(tr.length)out+='<div class="card"><h3>🎯 أكثر المحفّزات</h3>'+bars(tr)+'</div>';

  return out;
}

function plValidate(code){try{new Function('App','"use strict";\n'+code);return null}catch(e){return e.message}}
ACT.plsave=el=>{
  const name=$('#pl-name').value.trim(),code=$('#pl-code').value;
  if(!name||!code.trim()){toast('اكتب الاسم والكود');return}
  const err=plValidate(code);if(err){toast('خطأ في الكود: '+err,5000);return}
  snapshot('قبل تفعيل «'+name+'»');
  const id=el.dataset.id;
  if(id){const p=S.plugins.find(x=>x.id===id);if(code!==p.code){p.versions=p.versions||[];p.versions.unshift({t:Date.now(),code:p.code});p.versions=p.versions.slice(0,5);p.code=code}p.name=name;p.enabled=true;p.error=null;p.errs=0}
  else S.plugins.push({id:uid(),name:name,code:code,enabled:true,error:null,errs:0,versions:[]});
  editingPl=null;save();toast('تم الحفظ، جارٍ التطبيق…',1500);setTimeout(reloadApp,600);
};

  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thabat-backup-'+today()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
  S.settings.lastBackup=Date.now();save();toast('تم تجهيز النسخة، تحقق من التنزيلات');setTimeout(render,300);
};
ACT.copyjson=async()=>{const ok=await copyText(JSON.stringify(S));if(ok){S.settings.lastBackup=Date.now();save()}toast(ok?'تم النسخ، الصقه في مكان آمن':'تعذّر النسخ، استخدم التنزيل')};
async function importData(text){
  let o;try{o=JSON.parse(text)}catch(e){toast('النص ليس نسخة صالحة');return}
  if(!o||typeof o!=='object'||!o.counters){toast('هذه ليست نسخة من التطبيق');return}
  if(!(await ask('ستُستبدل بياناتك الحالية بالنسخة المستوردة. متابعة؟','استعادة',true)))return;
  snapshot('قبل الاستعادة');S=merge(defaults(),o);save();setTimeout(reloadApp,300);
}
CHG.impfile=el=>{const f=el.files&&el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>importData(String(r.result));r.readAsText(f)};
ACT.imptext=()=>importData($('#imp-text').value.trim());
ACT.snaprestore=async el=>{
  let snaps=[];try{snaps=JSON.parse(localStorage.getItem(KSNAP)||'[]')}catch(e){}
  const s=snaps[+el.dataset.i];if(!s)return;
  if(!(await ask('استعادة هذه اللقطة؟ ستُستبدل بياناتك الحالية.','استعادة',true)))return;
  try{S=merge(defaults(),JSON.parse(s.data));save();setTimeout(reloadApp,300)}catch(e){toast('تعذّرت الاستعادة')}
};
CHG.lockafter=el=>{S.settings.lockAfter=+el.value;save();toast('تم الحفظ',1200)};
ACT.accent=el=>{S.settings.accent=el.dataset.k;save();applyAccent();render()};
ACT.chpin=()=>{if(S.pin)showLock('verify');else showLock('setup1')};
ACT.wipe=async()=>{
  if(!(await ask('سيُمسح كل شيء: العدّادات، التقويم، الدفتر، القواعد والإضافات. هل أنت متأكد؟','نعم، تابع',true)))return;
  if(!(await ask('تأكيد أخير: لا رجوع بعد هذا إلا بنسخة احتياطية.','امسح كل شيء',true)))return;
  try{localStorage.removeItem(KEY)}catch(e){}location.reload();
};

/* ================= الطوارئ ================= */
let emT=null,emStart=0;
const EM_STEPS=['قم الآن وغيّر مكانك','ضع الهاتف بعيدًا أو سلّمه لأحد','توضأ وصلِّ ركعتين','اتصل بشخص أو اخرج للمشي'];
function closeEmergency(){
  if(emT){clearInterval(emT);emT=null}
  const o=$('#emerg');if(o)o.remove();
  if(!modals.length)document.body.classList.remove('noscroll');
}
function emTick(){
  const o=$('#emerg');if(!o){if(emT){clearInterval(emT);emT=null}return}
  const el=Math.floor((Date.now()-emStart)/1000),rem=Math.max(0,1200-el);
  $('#em-t').textContent=pad(Math.floor(rem/60))+':'+pad(rem%60);
  $('#em-p').setAttribute('stroke-dashoffset',(540.35*(rem/1200)).toFixed(1));
  if(rem>0){$('#em-b').textContent=(el%10)<4?'شهيق… (4)':'زفير… (6)'}
  else{$('#em-b').textContent='انتهى المؤقت';$('#em-msg').textContent='مرّت 20 دقيقة؛ غالبًا ضعفت الموجة أو زالت. اضغط «تجاوزتها» إن صمدت 💪';clearInterval(emT);emT=null;try{if(navigator.vibrate)navigator.vibrate(300)}catch(e){}}
}
function emTipText(){
  const ids=tipIds('urge').concat(tipIds('deen'),tipIds('nafs'));
  const t=tipById(pick(ids));return t?t.text:'';
}
function openEmergency(){
  closeEmergency();
  const reason=pick(S.lists.reasons),ifs=S.lists.ifthen.slice(0,3),alts=shuffle(S.lists.alts).slice(0,3),rl=S.rules.filter(r=>r.active).slice(0,4);
  const o=document.createElement('div');o.id='emerg';
  o.innerHTML='<div class="em-in"><button class="mx" data-act="emclose" aria-label="إغلاق">✕</button><h2 class="center">اهدأ… هذه موجة وستمرّ</h2>'+
  '<div class="emring"><svg viewBox="0 0 200 200"><circle class="rtrack" cx="100" cy="100" r="86"/><circle id="em-p" class="rprog" cx="100" cy="100" r="86" stroke="var(--acc)" stroke-dasharray="540.35" stroke-dashoffset="540.35" transform="rotate(-90 100 100)"/></svg><div class="emc"><b id="em-t">20:00</b><span id="em-b" class="mut">…</span></div></div><div class="pulse"></div><p id="em-msg" class="center mut sm"></p>'+
  '<div class="card"><h3>افعل الآن:</h3>'+EM_STEPS.map((s,i)=>'<label style="display:block;margin:6px 0"><input type="checkbox"> '+esc(s)+'</label>').join('')+'</div>'+
  (reason?'<div class="big-reason">❤️ '+esc(reason)+'</div>':'<div class="card mut sm">أضف أسبابك من «خطتي» لتظهر هنا.</div>')+
  (ifs.length?'<div class="card"><h3>خطتي لهذا الموقف</h3>'+ifs.map(x=>'<div>• '+esc(x)+'</div>').join('')+'</div>':'')+
  (alts.length?'<div class="card"><h3>بدائل جاهزة</h3>'+alts.map(x=>'<span class="chip">'+esc(x)+'</span>').join('')+'</div>':'')+
  (rl.length?'<div class="card"><h3>قواعدي</h3>'+rl.map(r=>'<div class="sm">📜 '+esc(r.text)+'</div>').join('')+'</div>':'')+
  '<div class="card"><div id="em-tip">'+esc(emTipText())+'</div><a data-act="emtip" class="sm">نصيحة أخرى</a></div>'+
  '<button class="btn ok big" data-act="emsurvive">تجاوزتها 💪</button><button class="btn bad" data-act="emfell">وقعتُ…</button></div>';
  document.body.appendChild(o);document.body.classList.add('noscroll');
  emStart=Date.now();emT=setInterval(emTick,1000);emTick();
}
ACT.emerg=()=>openEmergency();
ACT.emclose=()=>closeEmergency();
ACT.emtip=()=>{const t=$('#em-tip');if(t)t.textContent=emTipText()};
ACT.emsurvive=()=>{
  S.urges.survived++;S.urges.log.push({t:Date.now(),secs:Math.floor((Date.now()-emStart)/1000)});if(S.urges.log.length>300)S.urges.log.shift();
  save();closeEmergency();render();
  modal('<h3>💪 ما شاء الله!</h3><p>تجاوزت الرغبة للمرة <b>'+S.urges.survived+'</b>. هذه ليست صدفة؛ هذه عضلة إرادتك تقوى.</p><button class="btn gold" data-act="close">الحمد لله</button>');
};
ACT.emfell=()=>{closeEmergency();slipModal(S.ui.counter)};

/* ================= تشغيل ================= */
$('#fab').dataset.act='emerg';
boot();

})();
</script>
